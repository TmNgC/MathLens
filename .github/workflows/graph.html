<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathLens - Visualizer</title>
  
  <!-- Thư viện JSXGraph & KaTeX -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

  <style>
    /* =========================================
       1. THEME: TÍM ĐẬM CAO CẤP (DARK PURPLE)
       ========================================= */
    :root {
      --bg-app: #0b0614;         /* Nền tổng thể cực tối */
      --bg-panel: #160d24;       /* Nền sidebar/panel */
      --bg-card: #1f1433;        /* Nền các thẻ (card) */
      --text-main: #e2e8f0;      /* Chữ trắng ngà */
      --text-muted: #94a3b8;     /* Chữ xám */
      --purple-accent: #8b5cf6;  /* Tím sáng (chủ đạo cho nút) */
      --purple-glow: rgba(139, 92, 246, 0.4);
      --border: #2d1f42;         /* Viền */
      --danger: #ef4444;         /* Đỏ xoá */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      display: flex; height: 100vh; width: 100vw; overflow: hidden; 
      background: var(--bg-app); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* =========================================
       2. HOẠT HOẠ (ANIMATIONS) "LÀM MÀU"
       ========================================= */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 var(--purple-glow); }
      70% { box-shadow: 0 0 10px 4px rgba(139,92,246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(139,92,246, 0); }
    }

    .anim-fade-in { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* =========================================
       3. SIDEBAR (BẢNG ĐIỀU KHIỂN BÊN TRÁI)
       ========================================= */
    .sidebar {
      width: 400px; background: var(--bg-panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 10;
      box-shadow: 4px 0 20px rgba(0,0,0,0.5);
    }

    .header {
      padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
    }
    .header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; color: var(--text-main); }
    .back-btn { color: var(--purple-accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: 0.2s;}
    .back-btn:hover { text-shadow: 0 0 8px var(--purple-glow); }

    /* Khu vực quản lý hàm số */
    .func-list-container {
      padding: 20px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
    }

    /* Style giống hình ChatGPT/GeoGebra bạn gửi */
    .func-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 15px; display: flex; flex-direction: column; gap: 10px;
      transition: all 0.3s ease; opacity: 0;
    }
    .func-card:hover { border-color: var(--purple-accent); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

    .func-top-row { display: flex; align-items: center; gap: 12px; }
    .color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
    
    .func-input-wrapper { flex-grow: 1; display: flex; align-items: center; background: var(--bg-panel); border-radius: 8px; padding: 4px 10px; border: 1px solid var(--border); transition: 0.2s;}
    .func-input-wrapper:focus-within { border-color: var(--purple-accent); }
    .func-input-wrapper span { color: var(--text-muted); font-family: 'Times New Roman', serif; font-style: italic; margin-right: 5px; }
    .func-input { width: 100%; background: transparent; border: none; color: var(--text-main); font-size: 1rem; outline: none; font-family: monospace; }

    /* Nút icon: Mắt (Hiển thị) và Thùng rác (Xoá) */
    .icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; transition: 0.2s; padding: 5px; }
    .icon-btn:hover { color: var(--text-main); }
    .icon-btn.delete:hover { color: var(--danger); }
    .icon-btn.hidden { opacity: 0.3; }

    /* Vùng hiển thị LaTeX */
    .latex-preview { min-height: 35px; display: flex; align-items: center; padding-left: 26px; color: #cbd5e1; }

    .add-btn {
      background: transparent; border: 1px dashed var(--border); color: var(--text-muted);
      padding: 12px; border-radius: 12px; font-size: 0.95rem; cursor: pointer; transition: 0.2s;
      display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .add-btn:hover { border-color: var(--purple-accent); color: var(--purple-accent); }

    /* Khu vực Phân tích Toán học (Bảng biến thiên, Cực trị...) */
    .math-analysis-panel {
      padding: 20px; border-top: 1px solid var(--border); background: var(--bg-card);
      min-height: 250px;
    }
    .panel-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--purple-accent); margin-bottom: 15px; font-weight: 700; }
    .analysis-content { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; }

    /* =========================================
       4. GRAPH CONTAINER (JSXGRAPH DARK MODE)
       ========================================= */
    .graph-container { flex-grow: 1; position: relative; background: var(--bg-app); }
    .jxgbox { width: 100%; height: 100%; border: none; background: transparent !important; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-panel); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--purple-accent); }
  </style>
</head>
<body>

  <!-- BẢNG ĐIỀU KHIỂN -->
  <aside class="sidebar">
    <div class="header">
      <h1>MathLens</h1>
      <a href="#" class="back-btn">Trang chủ ↗</a>
    </div>

    <!-- Danh sách Hàm số -->
    <div class="func-list-container" id="func-list">
      <!-- Các hàm số sẽ được JS render vào đây -->
    </div>
    
    <div style="padding: 0 20px 20px;">
      <button class="add-btn" onclick="UI.addFunction()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Thêm hàm số
      </button>
    </div>

    <!-- KHU VỰC KẾT QUẢ GIẢI TÍCH (Chờ xử lý từ MathCore) -->
    <div class="math-analysis-panel">
      <div class="panel-title">Phân tích Toán học</div>
      <div id="analysis-output" class="analysis-content">
        <!-- Text mặc định -->
        Hãy nhập một hàm số. Hệ thống sẽ phân tích sự biến thiên, tìm nghiệm và các điểm cực trị tại đây...
      </div>
    </div>
  </aside>

  <!-- ĐỒ THỊ -->
  <main class="graph-container">
    <div id="box" class="jxgbox"></div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

  <script>
    /* ========================================================
       PHẦN 1: KHỞI TẠO ĐỒ THỊ (DARK MODE)
       ======================================================== */
    JXG.Options.board.minimizeReflow = 'none';
    
    // Ghi đè CSS của JSXGraph để phù hợp Dark Theme
    JXG.Options.text.useMathJax = false; 
    
    const board = JXG.JSXGraph.initBoard('box', {
      boundingbox: [-10, 10, 10, -10], 
      axis: false, // Ta tự vẽ trục để chỉnh màu đẹp hơn
      grid: true,
      showCopyright: false, 
      showNavigation: true,
      keepaspectratio: true
    });

    // Tuỳ chỉnh màu trục & lưới thành Dark Mode
    board.create('axis', [[0, 0], [1, 0]], {
      ticks: { strokeColor: '#475569', label: { strokeColor: '#94a3b8' } },
      strokeColor: '#64748b', strokeWidth: 1.5
    });
    board.create('axis', [[0, 0], [0, 1]], {
      ticks: { strokeColor: '#475569', label: { strokeColor: '#94a3b8' } },
      strokeColor: '#64748b', strokeWidth: 1.5
    });

    /* ========================================================
       PHẦN 2: KIẾN TRÚC TOÁN HỌC 
       Đây là nơi tập trung toàn bộ "Bộ não" của hệ thống
       ======================================================== */
    // 1. Tính đạo hàm số f'(x)
function derive(f, x, h = 1e-5) {
  return (f(x + h) - f(x - h)) / (2 * h);
}

// 2. Thuật toán phân tích biến thiên
function analyzeFunction(f, xMin = -10, xMax = 10, step = 0.02) {
  // Chuyển giá trị số thực x sang dạng chuỗi bội số của PI (ví dụ: Math.PI/2 -> "π/2")
function formatPi(val, eps = 1e-3) {
  if (Math.abs(val) < eps) return "0";

  const valInPi = val / Math.PI;
  // Các mẫu số lượng giác phổ biến: 1, 2, 3, 4, 6
  const denominators = [1, 2, 3, 4, 6];

  for (let d of denominators) {
    let n = Math.round(valInPi * d);
    if (Math.abs(valInPi - n / d) < eps) {
      // Rút gọn phân số n/d
      const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));
      const g = Math.abs(gcd(n, d));
      n /= g;
      d /= g;

      let prefix = "";
      if (n === -1) prefix = "-";
      else if (n !== 1) prefix = n.toString();

      let piStr = prefix + "π";
      return d === 1 ? piStr : `${piStr}/${d}`;
    }
  }

  // Nếu không trùng với mẫu số đẹp, trả về số thập phân 2 chữ số
  return val.toFixed(2);
}
  // Thuật toán chia đôi tìm nghiệm chính xác của h(x) = 0
function bisection(h, a, b, tol = 1e-6, maxIter = 100) {
  let fa = h(a), fb = h(b);
  if (fa * fb > 0) return (a + b) / 2;

  for (let i = 0; i < maxIter; i++) {
    let mid = (a + b) / 2;
    if (Math.abs(b - a) < tol) return mid;
    let fmid = h(mid);
    if (fmid === 0) return mid;

    if (fa * fmid < 0) {
      b = mid;
      fb = fmid;
    } else {
      a = mid;
      fa = fmid;
    }
  }
  return (a + b) / 2;
}

// Hàm chính tìm giao điểm giữa f(x) và g(x)
function findIntersections(f, g, xMin = -10, xMax = 10, step = 0.05) {
  const h = (x) => f(x) - g(x);
  const intersections = [];

  let prevX = xMin;
  let prevH = h(xMin);

  for (let x = xMin + step; x <= xMax; x += step) {
    const currH = h(x);

    // Phát hiện đổi dấu -> Có nghiệm trong khoảng (prevX, x)
    if (prevH * currH <= 0 && isFinite(prevH) && isFinite(currH)) {
      const rootX = bisection(h, prevX, x);
      const rootY = f(rootX);

      intersections.push({
        x: rootX,
        y: rootY,
        // Chuyển sang dạng ký hiệu đẹp để hiển thị lên UI
        label: `(${formatPi(rootX)}, ${formatPi(rootY)})`
      });
    }

    prevX = x;
    prevH = currH;
  }

  return intersections;
}

  function getTangentLine(f, x0) {
  const step = 1e-5;
  const y0 = f(x0);
  
  // Tính đạo hàm k = f'(x0) bằng sai phân
  const k = (f(x0 + step) - f(x0 - step)) / (2 * step);

  // Phương trình dạng y = kx + m
  const m = y0 - k * x0;

  // Phương trình tổng quát: Ax + By + C = 0 -> k*x - 1*y + m = 0
  const A = k;
  const B = -1;
  const C = m;

  return {
    point: { x: x0, y: y0, label: `(${formatPi(x0)}, ${formatPi(y0)})` },
    slope: k, // Hệ số góc
    // Véc-tơ pháp tuyến của đường tiếp tuyến
    normalVector: { x: A, y: B },
    // Véc-tơ chỉ phương
    directionVector: { x: -B, y: A }, 
    // Các dạng chuỗi phương trình
    explicitEquation: `y = ${k.toFixed(2)}x ${m >= 0 ? '+' : ''}${m.toFixed(2)}`,
    generalEquation: `${A.toFixed(2)}x - y ${C >= 0 ? '+' : ''}${C.toFixed(2)} = 0`
  };
}
  const extrema = [];            // Cực trị: [{ type: 'max'|'min', x, y }]
  const intervals = [];          // Khoảng đơn điệu: [{ start, end, type: 'inc'|'dec' }]
  const verticalAsymptotes = []; // Tiệm cận đứng: [x1, x2, ...]
  
  let currentTrend = null; // 'inc' (đồng biến) hoặc 'dec' (nghịch biến)
  let intervalStart = xMin;
  
  let prevX = xMin;
  let prevDy = derive(f, xMin);

  for (let x = xMin; x <= xMax; x += step) {
    const y = f(x);

    // --- A. Kiểm tra Tiệm cận đứng ---
    if (!isFinite(y) || Math.abs(y) > 1e4) {
      // Đánh dấu điểm bất định / tiệm cận đứng
      const asymptX = Number(x.toFixed(2));
      if (!verticalAsymptotes.includes(asymptX)) {
        verticalAsymptotes.push(asymptX);
      }
      
      // Chốt khoảng đơn điệu hiện tại trước khi ngắt đoạn
      if (currentTrend) {
        intervals.push({ start: Number(intervalStart.toFixed(2)), end: Number(prevX.toFixed(2)), type: currentTrend });
        currentTrend = null;
      }
      continue;
    }

    const dy = derive(f, x);
    const trend = dy > 0 ? 'inc' : (dy < 0 ? 'dec' : null);

    // --- B. Phát hiện Cực trị & Chuyển đổi khoảng đơn điệu ---
    if (prevDy !== null && Math.sign(prevDy) !== Math.sign(dy) && Math.abs(dy) < 5) {
      // Xác định điểm cực trị chính xác hơn bằng cách lấy trung bình
      const xExtremum = Number(((prevX + x) / 2).toFixed(2));
      const yExtremum = Number(f(xExtremum).toFixed(2));

      if (prevDy > 0 && dy < 0) {
        extrema.push({ type: 'Cực đại', x: xExtremum, y: yExtremum });
      } else if (prevDy < 0 && dy > 0) {
        extrema.push({ type: 'Cực tiểu', x: xExtremum, y: yExtremum });
      }
    }

    // --- C. Cập nhật khoảng Đồng biến / Nghịch biến ---
    if (trend && trend !== currentTrend) {
      if (currentTrend) {
        intervals.push({ start: Number(intervalStart.toFixed(2)), end: Number(x.toFixed(2)), type: currentTrend });
      }
      currentTrend = trend;
      intervalStart = x;
    }

    prevX = x;
    prevDy = dy;
  }

  // Đóng khoảng đơn điệu cuối cùng
  if (currentTrend) {
    intervals.push({ start: Number(intervalStart.toFixed(2)), end: xMax, type: currentTrend });
  }

  // --- D. Kiểm tra Tiệm cận ngang (x -> +- Infinity) ---
  const horizontalAsymptotes = [];
  const xFar = 1e6;
  
  const yPos = f(xFar);
  const yPosNext = f(xFar + 100);
  if (isFinite(yPos) && Math.abs(yPos - yPosNext) < 1e-3) {
    horizontalAsymptotes.push({ direction: 'x → +∞', y: Number(yPos.toFixed(2)) });
  }

  const yNeg = f(-xFar);
  const yNegNext = f(-xFar - 100);
  if (isFinite(yNeg) && Math.abs(yNeg - yNegNext) < 1e-3) {
    horizontalAsymptotes.push({ direction: 'x → -∞', y: Number(yNeg.toFixed(2)) });
  }

  return {
    extrema,
    intervals,
    verticalAsymptotes,
    horizontalAsymptotes
  };
}

    // 5. Xét Dấu / Bảng biến thiên (Variation Table)
      getVariationText: function(expr) {
        try {
          // A. Sử dụng "khuyến khích khai báo" mà bạn nhắc đến
          const compiled = math.compile(expr);
          const f = (xVal) => compiled.evaluate({ x: xVal });

          // B. Đưa hàm f vào thuật toán của bạn để lấy kết quả
          const result = analyzeFunction(f, -10, 10, 0.05);

          // C. Bọc kết quả JSON thành chuỗi HTML/LaTeX để in ra màn hình
          let outputHtml = `<div style="font-size: 0.9rem; line-height: 1.6;">`;
          
          // 1. In Khoảng đơn điệu
          if (result.intervals.length > 0) {
            outputHtml += `<strong style="color: #cbd5e1;">Khoảng đơn điệu:</strong><br>`;
            result.intervals.forEach(i => {
              let text = i.type === 'inc' ? 'Đồng biến ↗' : 'Nghịch biến ↘';
              outputHtml += `&bull; ${text} trên khoảng (${i.start} ; ${i.end})<br>`;
            });
          }

          // 2. In Cực trị
          if (result.extrema.length > 0) {
            outputHtml += `<br><strong style="color: #cbd5e1;">Cực trị cục bộ:</strong><br>`;
            result.extrema.forEach(e => {
              outputHtml += `&bull; ${e.type} tại $x = ${e.x}$ ($y = ${e.y}$)<br>`;
            });
          }

          // 3. In Tiệm cận đứng
          if (result.verticalAsymptotes.length > 0) {
             outputHtml += `<br><strong style="color: #cbd5e1;">Tiệm cận đứng:</strong><br>`;
             result.verticalAsymptotes.forEach(x => {
                outputHtml += `&bull; Đường thẳng $x = ${x}$<br>`;
             });
          }

          outputHtml += `</div>`;
          return outputHtml;

        } catch(e) {
          return "Đang chờ biểu thức hợp lệ...";
        }
      }
    /* ========================================================
       PHẦN 3: QUẢN LÝ DỮ LIỆU & RENDER GIAO DIỆN (UI)
       ======================================================== */
    const COLORS = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#d946ef']; // Xanh, Đỏ, Lục, Cam, Tím
    let functionsState = [];
    let nextFuncId = 1;

    const UI = {
      listEl: document.getElementById('func-list'),
      analysisEl: document.getElementById('analysis-output'),

      // Thêm hàm số mới
      addFunction: function(initialExpr = '') {
        if (functionsState.length >= 5) return; // Giới hạn 5 hàm
        const newFunc = {
          id: nextFuncId++,
          expr: initialExpr,
          color: COLORS[functionsState.length % COLORS.length],
          isVisible: true,
          graphObj: null
        };
        functionsState.push(newFunc);
        this.renderList();
        Engine.updateGraphs();
      },

      // Cập nhật giá trị biểu thức
      updateExpr: function(id, value) {
        const f = functionsState.find(x => x.id === id);
        if (f) {
          f.expr = value;
          Engine.updateGraphs();
          this.updateAnalysisPanel();
        }
      },

      // Bật/Tắt hiển thị đồ thị (Nút Mắt)
      toggleVisibility: function(id) {
        const f = functionsState.find(x => x.id === id);
        if (f) {
          f.isVisible = !f.isVisible;
          this.renderList();
          Engine.updateGraphs();
        }
      },

      // Xoá hàm số
      deleteFunction: function(id) {
        functionsState = functionsState.filter(x => x.id !== id);
        this.renderList();
        Engine.updateGraphs();
        this.updateAnalysisPanel();
      },

      // Vẽ HTML danh sách
      renderList: function() {
        this.listEl.innerHTML = '';
        functionsState.forEach((f, index) => {
          const card = document.createElement('div');
          card.className = 'func-card anim-fade-in';
          card.style.animationDelay = `${index * 0.1}s`; // Hiệu ứng trượt lần lượt

          // Mắt nhắm/mở
          const eyeIcon = f.isVisible 
            ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
            : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

          card.innerHTML = `
            <div class="func-top-row">
              <div class="color-dot" style="background-color: ${f.color}; ${f.isVisible ? `box-shadow: 0 0 8px ${f.color};` : 'opacity: 0.2'}"></div>
              <div class="func-input-wrapper">
                <span>f(x)=</span>
                <input type="text" class="func-input" value="${f.expr}" 
                       placeholder="Ví dụ: sin(x) hoặc x^2" 
                       oninput="UI.updateExpr(${f.id}, this.value)">
              </div>
              <button class="icon-btn ${!f.isVisible ? 'hidden' : ''}" onclick="UI.toggleVisibility(${f.id})">${eyeIcon}</button>
              <button class="icon-btn delete" onclick="UI.deleteFunction(${f.id})">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>
            <div class="latex-preview" id="latex-${f.id}"></div>
          `;
          this.listEl.appendChild(card);
        });
      },

      // Cập nhật nội dung bảng Phân tích Toán học
      // Cập nhật nội dung bảng Phân tích Toán học
      updateAnalysisPanel: function() {
        if (functionsState.length === 0) {
          this.analysisEl.innerHTML = `Hãy nhập một hàm số...`;
          return;
        }

        let mainFunc = functionsState[0];
        if (!mainFunc.expr.trim()) return;

        let outputHtml = "";

        try {
          // --- 1. BIỂU DIỄN HÀM SỐ 1 VÀ BIẾN THIÊN ---
          let texFx = math.parse(mainFunc.expr).toTex();
          outputHtml += `<div style="margin-bottom: 10px;">Hàm số 1: <br><span id="tex-fx"></span></div>`;
          
          let deriv = MathCore.getDerivative(mainFunc.expr);
          if (deriv) {
            let texDeriv = math.parse(deriv).toTex();
            outputHtml += `<div style="margin-bottom: 10px;">Đạo hàm: <br><span id="tex-dfx"></span></div>`;
            outputHtml += `<div style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); color: #8b5cf6;">
                             ${MathCore.getVariationText(mainFunc.expr)}
                           </div>`;
          }

          // --- 2. THÔNG TIN TIẾP TUYẾN TẠI X = 0 (Demo) ---
          const compiledMain = math.compile(mainFunc.expr);
          const fMain = (xVal) => compiledMain.evaluate({ x: xVal });
          const tangent = getTangentLine(fMain, 0); // Tính tiếp tuyến tại x0 = 0
          
          outputHtml += `<div style="margin-top: 15px; padding-top: 10px; border-top: 1px dashed var(--border);">
                           <strong style="color: #10b981;">Tiếp tuyến tại Giao điểm Oy (x=0):</strong><br>
                           <span style="color: var(--text-muted); font-size: 0.9rem;">
                           • Điểm tiếp xúc: ${tangent.point.label}<br>
                           • PT Tiếp tuyến: $${tangent.explicitEquation}$<br>
                           • Vector pháp tuyến: $\\vec{n} = (${tangent.normalVector.x.toFixed(1)}; ${tangent.normalVector.y.toFixed(1)})$
                           </span>
                         </div>`;

          // --- 3. PHÂN TÍCH TƯƠNG GIAO (NẾU CÓ >= 2 HÀM) ---
          if (functionsState.length >= 2 && functionsState[1].expr.trim()) {
             let secFunc = functionsState[1];
             const compiledSec = math.compile(secFunc.expr);
             const gSec = (xVal) => compiledSec.evaluate({ x: xVal });
             
             const intersections = findIntersections(fMain, gSec);
             
             outputHtml += `<div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--purple-accent);">
                              <strong style="color: #f59e0b;">Sự tương giao với hàm 2:</strong><br>`;
             
             if(intersections.length > 0) {
               intersections.forEach((pt, idx) => {
                  outputHtml += `<span style="color: var(--text-muted); font-size: 0.9rem;">&bull; Giao điểm ${idx + 1}: Tọa độ $${pt.label}$</span><br>`;
               });
             } else {
               outputHtml += `<span style="color: var(--text-muted); font-size: 0.9rem;">Không có giao điểm trong vùng nhìn thấy.</span>`;
             }
             outputHtml += `</div>`;
          }

          this.analysisEl.innerHTML = outputHtml;
          
          // Quét toàn bộ thẻ div để render lại các dấu $...$ được chèn vào HTML
          renderMathInElement(this.analysisEl, {
            delimiters: [ {left: "$", right: "$", display: false} ]
          });

        } catch (e) {
           this.analysisEl.innerHTML = `Lỗi biểu thức Toán học.`;
        }
      }


    /* ========================================================
       PHẦN 4: ENGINE XỬ LÝ ĐỒ THỊ
       ======================================================== */
    /* ========================================================
       PHẦN 4: ENGINE XỬ LÝ ĐỒ THỊ
       ======================================================== */
    let tempPoints = []; // Mảng chứa các điểm giao cắt để xoá đi vẽ lại

    const Engine = {
      updateGraphs: function() {
        // Xoá tất cả đồ thị và điểm giao cũ
        functionsState.forEach(f => {
          if (f.graphObj) { board.removeObject(f.graphObj); f.graphObj = null; }
        });
        tempPoints.forEach(pt => board.removeObject(pt));
        tempPoints = [];

        // 1. Vẽ các hàm số
        functionsState.forEach(f => {
          if (!f.expr.trim()) return;
          try {
            let tex = math.parse(f.expr).toTex();
            katex.render(`f(x) = ${tex}`, document.getElementById(`latex-${f.id}`), { throwOnError: false });
          } catch(e) {}

          if (f.isVisible) {
            try {
              let compiled = math.compile(f.expr);
              f.graphObj = board.create('functiongraph', [
                (x) => compiled.evaluate({x: x})
              ], { 
                strokeColor: f.color, strokeWidth: 3, highlight: true, shadow: true 
              });
            } catch(e) {}
          }
        });

        // 2. Chấm điểm tương giao nếu có >= 2 hàm
        if (functionsState.length >= 2 && functionsState[0].isVisible && functionsState[1].isVisible) {
          try {
             let c1 = math.compile(functionsState[0].expr);
             let c2 = math.compile(functionsState[1].expr);
             let fMain = (x) => c1.evaluate({x});
             let gSec = (x) => c2.evaluate({x});
             
             let intersections = findIntersections(fMain, gSec);
             
             intersections.forEach(pt => {
                // Tạo điểm bằng JSXGraph
                let jxgPt = board.create('point', [pt.x, pt.y], {
                  name: pt.label,
                  size: 4, 
                  face: 'circle',
                  fillColor: '#f59e0b', // Màu cam nổi bật trên nền tối
                  strokeColor: '#ffffff',
                  strokeWidth: 2,
                  label: { offset: [10, 15], strokeColor: '#e2e8f0', fontSize: 13 }
                });
                tempPoints.push(jxgPt);
             });
          } catch (e) {
             // Im lặng nếu hàm chưa gõ xong
          }
        }
      }
    };

  </script>
